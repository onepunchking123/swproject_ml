# 공개 낙상 데이터셋 레지스트리
#
# fetch 스크립트가 이 파일을 읽어 다운로드·MD5 검증·해제를 수행한다.
# 모든 값은 2026-09-20 에 실제 API/페이지에서 확인한 것이다. 추측값은 "확인 필요" 로 표기.
#
# 라벨 스키마는 OmniFall 을 그대로 채택한다 (아래 schema 참고). 나중에 AI Hub 데이터도
# 같은 컬럼으로 매핑해 넣으면 모든 모델이 하나의 로더로 돈다.

schema:
  name: omnifall_v1
  columns: [path, label, start, end, subject, cam, dataset]
  notes:
    - path 는 dataset 상대경로이며 확장자 없음. 유일성은 (dataset, path) 쌍에서만 보장된다.
    - start / end 는 초 단위 float. subject / cam 은 in-the-wild(OOPS) 와 synthetic 에서 -1.
    - '연속 영상 해석: "{root}/{dataset}/video/{path}.mp4" (HF 공식 레이아웃)'
    - Zenodo 배포판은 구간별로 미리 잘린 클립이라 레이아웃이 다르다. sources.omnifall_zenodo.layout 참고.

# 16 클래스. staged 데이터셋은 0-9 만 사용, 10-15 는 OOPS/synthetic 에만 등장하며 9(other) 로 접어도 된다.
label2id:
  walk: 0
  fall: 1          # 넘어지는 동작 자체 (관성 운동이 멎을 때까지)
  fallen: 2        # 넘어진 뒤 바닥/매트리스에 있는 상태  ← "미동 없음" 판정의 기준 상태
  sit_down: 3
  sitting: 4
  lie_down: 5      # 의도적으로 누움 (fall 과 대비)
  lying: 6         # 의도적으로 누운 상태  ← fallen 과 반드시 구분해야 함
  stand_up: 7      # 누움→앉음 전환도 포함
  standing: 8
  other: 9
  kneel_down: 10
  kneeling: 11
  squat_down: 12
  squatting: 13
  crawl: 14
  jump: 15

# 본 프로젝트의 이진 낙상 판정용 축약. Stage 2 학습 시 이 매핑을 쓴다.
label_groups:
  fall_event: [1]                 # 낙상 발생
  post_fall: [2]                  # 낙상 후 상태 (미동 판정 대상)
  normal_rest: [4, 6, 8, 11, 13]  # 정상 정지 자세 — 미동이어도 정상
  transition: [3, 5, 7, 10, 12]
  locomotion: [0, 14, 15]
  other: [9]

sources:

  # ───────────────────────────────────────────────────────────────────
  # 1) OmniFall 통합 배포판 (영상 클립) — Zenodo
  # ───────────────────────────────────────────────────────────────────
  omnifall_zenodo:
    doi: 10.5281/zenodo.17170592
    record_api: https://zenodo.org/api/records/17170592
    published: 2025-09-21
    version: "1.0"
    license_distribution: cc-by-4.0     # 배포판 표기. 각 원본의 라이선스가 우선한다 (아래 components).
    total_gb: 30.1
    geo_block: false                    # AI Hub 와 달리 Colab(해외 IP)에서 직접 다운로드 가능
    # 각 클립이 두 가지 파일명 규칙으로 두 번 들어있다 (Cauca 에서 258쌍 전부 CRC 동일 확인).
    # 짧은 형식만 유지한다 — mmaction2_annotations.txt 가 가리키는 쪽이다.
    layout_short: "{name}/clips/Subject.{subject}/{Action}S{subject}_{label}_{start}_{end}_{subject}_{cam}_{dataset}.avi"
    layout_long_duplicate: "{name}/clips/Subject.{subject}/Subject.{subject}_{action_snake}_01_{start}_{end}_{label}_{cam}_{subject}_{dataset}.avi"
    dedup: keep_short_drop_long          # 해제 직후 긴 형식 삭제 → 디스크 50% 절감
    duplication_ratio_observed: 0.50     # Cauca 기준. 다른 zip 도 같은지 해제 시 검증
    per_dataset_files:
      - "{name}/{dataset}.csv"             # omnifall_v1 스키마
      - "{name}/mmaction2_annotations.txt" # "상대경로 라벨" 한 줄 형식 (Windows 역슬래시 주의)
    verify_after_extract:
      - "avi 개수 == CSV 구간 수 × 2 인지 (두 파일명 규칙 중복). 아니면 해당 zip 은 구조가 다르다"
      - 짧은/긴 형식 쌍의 CRC·크기 일치 → 일치하면 긴 형식 삭제
      - 짧은 형식 파일명의 label 과 CSV label 일치 (Cauca 258/258 일치 확인)
      - CSV(zip 내) == HF labels/{dataset}.csv 동일성 (Cauca 동일 확인)
    # 다운로드 순서: 작은 것부터 → 파이프라인이 작은 파일로 먼저 검증된다
    files:
      - name: Cauca_fall.zip
        dataset: caucafall
        size_gb: 0.17
        size_bytes: 173504611
        md5: 5a1899fe0022c9c4c0d37ce64ac0c986
        url: https://zenodo.org/api/records/17170592/files/Cauca_fall.zip/content
        subjects: 10
        duration: 16m
        license_original: 확인 필요 (Mendeley Data 배포, CC-BY 계열로 추정)
        verified_locally: true         # 2026-09-20 맥북에서 받아 MD5·구조 확인
      - name: EDF.zip
        dataset: edf
        size_gb: 0.99
        size_bytes: 991221216
        md5: a45b3b84f329b00817db31634f92c6e1
        url: https://zenodo.org/api/records/17170592/files/EDF.zip/content
        subjects: 5
        duration: 13m
        license_original: 확인 필요 (연구 목적)
        pitfall: 다중 카메라 — 일부 구간 end 가 영상 길이를 초과 (최대 7.36s). 로더에서 clip 처리.
      - name: OOPS_1k.zip
        dataset: OOPS
        size_gb: 1.03
        size_bytes: 1025661867
        md5: 52ccdcfaf8832a8845ec6a070b8bd917
        url: https://zenodo.org/api/records/17170592/files/OOPS_1k.zip/content
        subjects: -1
        duration: 실제 사고 영상 큐레이션 (in-the-wild)
        license_original: 확인 필요 (YouTube 유래, 연구 목적)
        role: test_only               # 연출 데이터로 학습 → 실제 사고로 평가 (일반화 지표)
      - name: GMDCSA24.zip
        dataset: GMDCSA24
        size_gb: 1.67
        size_bytes: 1671761923
        md5: 920bfdda892244c4d9f3c405bce41267
        url: https://zenodo.org/api/records/17170592/files/GMDCSA24.zip/content
        subjects: 4
        duration: 21m
        license_original: MIT          # 상업 이용 가능 — 서비스 모델 학습에 쓸 수 있는 유일한 공개셋
        origin: https://github.com/ekramalam/GMDCSA24-A-Dataset-for-Human-Fall-Detection-in-Videos
      - name: MCFD.zip
        dataset: mcfd
        size_gb: 2.80
        size_bytes: 2803136235
        md5: b365b5a4b16691fce3fc09ccd554df79
        url: https://zenodo.org/api/records/17170592/files/MCFD.zip/content
        subjects: 1
        duration: 12m
        cams: 8
        license_original: 확인 필요 (Université de Montréal, 연구 목적)
        pitfall: 다중 카메라 — 85/1352 구간이 영상 끝을 초과 (최대 1.19s)
      - name: UP_Fall.zip
        dataset: up_fall
        size_gb: 3.18
        size_bytes: 3177158271
        md5: baa972b1d215e04c18574f3a647ebf01
        url: https://zenodo.org/api/records/17170592/files/UP_Fall.zip/content
        subjects: 17
        duration: 4h35m                # staged 중 최대
        license_original: 확인 필요 (저자 허가 기반 배포)
        origin: https://sites.google.com/up.edu.mx/har-up/
      - name: LE2I.zip
        dataset: le2i
        size_gb: 9.07
        size_bytes: 9065707715
        md5: 21986336fd68b5b60d973237b83d2d67
        url: https://zenodo.org/api/records/17170592/files/LE2I.zip/content
        subjects: 9
        duration: 47m
        environments: [Home_01, Home_02, Coffee_room_01, Coffee_room_02, Lecture_room, Office]
        license_original: CC-BY-NC-SA-3.0   # 비상업 — 논문 전용
        origin: https://search-data.ubfc.fr/imvia/FR-13002091000019-2024-04-09_Fall-Detection-Dataset.html
      - name: OCCU.zip
        dataset: occu
        size_gb: 11.15
        size_bytes: 11147744147
        md5: af66c070a28d110c5148be69d4b79afa
        url: https://zenodo.org/api/records/17170592/files/OCCU.zip/content
        subjects: 5
        duration: 14m
        note: 가림(occlusion) 상황 — 가구 뒤 낙상 등. 실환경 강건성 평가에 유용.
        license_original: 확인 필요 (연구 목적)

  # ───────────────────────────────────────────────────────────────────
  # 2) OmniFall 어노테이션·split — Hugging Face (gated 아님, 토큰 불필요)
  # ───────────────────────────────────────────────────────────────────
  omnifall_hf:
    repo: simplexsigil2/omnifall
    api: https://huggingface.co/api/datasets/simplexsigil2/omnifall
    resolve_base: https://huggingface.co/datasets/simplexsigil2/omnifall/resolve/main
    license_annotations: cc-by-nc-4.0   # 어노테이션·split 정의. 비상업.
    gated: false
    last_modified: 2026-08-27
    docs: [README.md, LABELS.md, STRUCTURE.md, KNOWN_PITFALLS.md, CONFIGS.md]
    labels_dir: labels/                 # caucafall.csv, le2i.csv, up_fall.csv, mcfd.csv, edf.csv, occu.csv, GMDCSA24.csv, OOPS.csv, cmdfall.csv, of-syn.csv, label2id.csv
    splits_dir: splits/                 # cs/ (cross-subject), cv/ (cross-view), syn/
    configs_of_interest:
      - of-sta-cs            # staged 8종, cross-subject — 기본 학습/평가
      - of-sta-cv            # cross-view — 카메라 위치 독립성 검증 (본 연구 핵심 주장)
      - of-sta-to-all-cs     # staged 학습 → in-the-wild 포함 전체 테스트
    pip: omnifall            # pip install omnifall ; omnifall.load("of-sta-cs", split="test")
    extras_not_in_zenodo:
      - cmdfall (384 연속 영상, 7 Kinect 뷰) — Zenodo 배포판에 없음. 원본 별도 확보 필요.
      - of-syn (합성 12,000편, 9.1GB AV1) — data_files/omnifall-synthetic_av1.tar 로 HF 에서 직접.

  # ───────────────────────────────────────────────────────────────────
  # 2b) OmniFall 합성(OF-Syn) — Hugging Face 직접. 노년 그룹 + 카메라 고도·방위 라벨
  # ───────────────────────────────────────────────────────────────────
  omnifall_syn:
    file: data_files/omnifall-synthetic_av1.tar
    url: https://huggingface.co/datasets/simplexsigil2/omnifall/resolve/main/data_files/omnifall-synthetic_av1.tar
    size_bytes: 9716480000          # HEAD Content-Length / x-linked-size (2026-09-20)
    sha256: c1f7b3beeedf2ffbdb3a3c131da512ceef0d788a93aac93c656b3978a945f13a   # HF x-linked-etag (LFS oid)
    videos: 12000                   # 12,000 AV1 mp4. split: train 15,344 / val 1,956 / test 1,928 구간
    codec: av1                      # OpenCV 가 못 읽을 수 있다 → ffmpeg 로 h264 트랜스코딩 후 사용
    labels: labels/of-syn.csv       # 7 core + 12 인구통계·카메라 컬럼 (age_group, camera_elevation, camera_azimuth ...)
    framewise: data_files/syn_frame_wise_labels.tar.zst
    license: cc-by-nc-4.0
    geo_block: false
    fills_gap:
      - "노년: age_group=elderly_65_plus (staged 데이터셋에는 거의 없음)"
      - "카메라 독립성: camera_elevation {eye,low,high,top} × azimuth {front,rear,left,right} 라벨로 통제 실험 가능"
    role: 학습 보조 + 카메라 위치 ablation. 합성이므로 실측 성능 주장에는 쓰지 않는다
    drive_dest: falldata/omnifall_syn

  # ───────────────────────────────────────────────────────────────────
  # 2c) E-FPDS — 쓰러진 사람 BBOX 이미지 (Stage 1). UAH GRAM, SharePoint 직접 링크
  # ───────────────────────────────────────────────────────────────────
  efpds:
    page: https://gram.web.uah.es/data/datasets/fpds/index.html
    images: 6982
    classes: {fallen: 5023, adl: 2275}
    elderly_images: 413             # 65세 이상 자원자
    # 실제 라벨 형식 (2026-09-20 확인): "YOLO txt" 라 적혀 있지만 정규화 좌표가 아니다.
    #   한 줄 = "class x_min x_max y_min y_max"  (픽셀 절대좌표, darknet BBox-Label-Tool 형식)
    #   예: 640x480 이미지에 "1 173 562 367 472" → x 173~562, y 367~472 (누운 사람의 넓고 낮은 박스)
    #   YOLO 변환: xc=(x_min+x_max)/2/W, yc=(y_min+y_max)/2/H, w=(x_max-x_min)/W, h=(y_max-y_min)/H
    #   class 1 = fallen 으로 추정 (Info_splits 의 FallenPersons/NonFallenPersons 와 대조해 확정할 것)
    format: "class x_min x_max y_min y_max (절대 픽셀) → YOLO 정규화 변환 필요"
    image_format: "png — 해상도 혼재 (640x480, 1920x1080 급 등)"
    splits:                          # FPDS_info/Info_splits.txt
      train: {splits: [split01, split02, split03, split10, split11], frames: 4808, fallen: 3867, nonfallen: 1005}
      valid: {splits: [split12, split13], frames: 1201, fallen: 765, nonfallen: 440}
      test:  {splits: [split04, split05, split06, split07, split08], frames: 973, fallen: 391, nonfallen: 830}
    files:
      - {name: train.tar.gz, size_bytes: 1803111124, md5: a434e1cbcb6709c6dcccee87438c8700, status: "Drive 에 있음 (png 4808 / txt 4808). 1차 다운로드는 104MB 에서 잘려 재다운로드"}
      - {name: valid.tar.gz, size_bytes: 433222189, status: "Drive 에 있음 (png 1175 / txt 1201)"}
      - {name: test.tar.gz,  size_bytes: 373167151, status: "Drive 에 있음 (png 973 / txt 973)"}
      - {name: FPDS_info.tar.gz, status: "Drive 에 있음 — labels/ 1,201 txt + Info_splits.txt + 분할 스크립트를 하나로 묶음 (개별 업로드는 파일당 API 지연으로 80분)"}
    drive_dest: falldata/efpds
    download: SharePoint 직접 링크 — curl 은 HTML 만 받으므로 **브라우저로 받아** rclone 으로 Drive 에 올린다
    license: 인용 필수 — Maldonado-Bascón et al., "Fallen People Detection Capabilities Using Assistive Robot", Electronics 2019
    fills_gap: "Stage 1 — COCO 사전학습 검출기가 약한 '누워 있는/쓰러진 사람' 자세"

  # ───────────────────────────────────────────────────────────────────
  # 2e) FallVision — Harvard Dataverse, CC0 1.0. 58명, 침대·의자·서서 낙상 + 비낙상
  # ───────────────────────────────────────────────────────────────────
  fallvision:
    doi: 10.7910/DVN/75QPKK
    api: "https://dataverse.harvard.edu/api/datasets/:persistentId/?persistentId=doi:10.7910/DVN/75QPKK"
    download_url_pattern: "https://dataverse.harvard.edu/api/access/datafile/{id}"
    license: CC0-1.0                    # 퍼블릭 도메인 — 서비스 모델 학습에도 사용 가능
    published: 2025-02-02
    paper: "Data in Brief 2025, doi:10.1016/j.dib.2025.111440"
    subjects: 58
    capture: "Optoma SC26B 4K 30fps 웹캠 + iPhone 11 Pro Max, Galaxy A32, Pixel 6a"
    geo_block: false
    files_total: 60
    size_total_gb: 49.57
    naming: "{f|nf}_{raw|mask}_{b|c|s}_{n}.rar — f 낙상/nf 비낙상 · b 침대/c 의자/s 서서 · rar 분할"
    subsets:
      raw:  {files: 20, size_gb: 16.8, note: "원본 영상 — YOLO-pose 로 키포인트를 직접 뽑으므로 이것만 필요"}
      mask: {files: 20, size_gb: 32.4, note: "배경 제거(랜드마크) 영상 — 불필요"}
      keypoints_csv: {files: 20, size_gb: 0.4, note: "저자가 뽑은 랜드마크 CSV (파일명 'ketpoints' 오타 6개) — 비교용"}
    fetch_plan: "raw + keypoints_csv ≈ 17.2GB → falldata/fallvision/ (Colab, Dataverse API 직접)"
    drive_dest: falldata/fallvision
    status: "Drive 확보 완료 2026-09-21 — 40/40 MD5 검증 (raw 20 + keypoints_csv 20), manifest.json"
    pitfall: "동시 연결이 많으면(2파일×16) 일부 403 — 재시도는 연결 4·파일 1개씩"
    format_note: "rar 분할 압축 — VM 에 unrar 또는 7z 필요"
    fills_gap: "침대·의자에서의 낙상(치매환자 병실 시나리오) + CC0 라이선스"

  # ───────────────────────────────────────────────────────────────────
  # 2f) TF-66 — 열화상(야간·프라이버시) 낙상. 비상업 공개, 접근은 저자 문의
  # ───────────────────────────────────────────────────────────────────
  tf66:
    paper: "Thermal Fall 66 (Engineering Applications of AI, 2025) · TechRxiv 프리프린트"
    sensor: "천장 부착 Calumino Thermal Sensor EVK, 140x60 @ 4fps"
    videos: {fall: 562, nonfall: 250}
    subjects: 66
    environments: 9
    subsets: [height-based, senior-specific, hospital]
    license: 비상업 공개
    access: "프리프린트에서 저장소 링크가 리뷰용으로 삭제됨 — 저자(Lakehead Univ., C. Silver / T. Akilan) 이메일 문의 또는 출판본의 GitHub 링크"
    fills_gap: "야간·프라이버시 — 치매환자 야간 모니터링. 해상도 140x60 이라 YOLO-pose 불가, 별도 열화상 분기 모델용"
    status: contact_authors

  # ───────────────────────────────────────────────────────────────────
  # 2d) 요청이 필요한 데이터셋 (사용자가 직접 신청)
  # ───────────────────────────────────────────────────────────────────
  request_required:
    cmdfall:
      page: https://www.mica.edu.vn/perso/Tran-Thi-Thanh-Hai/CMDFALL.html
      how: 저자 이메일 요청 (연구 목적 무료)
      why: 50명 × 20 동작, 7 Kinect 뷰 **연속 녹화** 384편 — OmniFall 이 이미 라벨링했지만 Zenodo 배포판에 영상이 없다. 스트리밍 평가·미동 판정에 필요
    toyota_smarthome:
      page: https://project.inria.fr/toyotasmarthome/
      how: 라이선스 폼 (학술 연구 전용)
      why: 60–80세 노인 18명의 실제 일상(7 Kinect, RGB+D). 낙상은 없지만 **오래 앉음·누움 등 정상 정지 구간**이 풍부 — 미동 판정의 음성(정상) 샘플
    toyota_smarthome_untrimmed:
      page: https://project.inria.fr/toyotasmarthome/
      how: "같은 폼 (TSU 선택)"
      why: "같은 노인 18명, 평균 21분짜리 연속 영상 536편, 51 활동 라벨, RGB+D+3D 골격 — 미동 판정의 장시간 음성 구간에 가장 적합"
    ntu_rgbd_120:
      page: https://rose1.ntu.edu.sg/dataset/actionRecognition/
      how: "ROSE Lab 회원 등록 + 동의 (학술)"
      why: "114,480 샘플 · 120 클래스 · A43 falling · 3D 골격 25관절 — Stage 2 골격 모델 사전학습. 골격 zip 2개면 ~10GB. 실험실 환경·젊은 피험자라 도메인은 다름"
      note: "figshare 등 비공식 재배포본이 있으나 라이선스상 공식 경로로 받는다"
    etri_activity3d:
      paper: https://arxiv.org/abs/2003.01920
      how: "ETRI AI 나눔(nanum.etri.re.kr) 신청 — 2026-09-20 접속 거부로 미확인. 저장소 github.com/ai4r/AIR-Action-Recognition 은 전처리 .mat(Google Drive)만 제공"
      why: "한국 노인 50명(64~88세, 평균 77세) + 청년 50명, 55 일상 행동, 112,620 샘플, Kinect v2 8대(4 플랫폼 × 70/120cm), RGB 1920x1080 + depth + 25관절 골격, 아파트 환경 — 서비스 도메인(한국·노인·실내)과 가장 가까움"
      caveat: "55 클래스에 낙상이 포함되는지 미확인 — 클래스 목록 확인 필요"
    homage:
      page: https://github.com/nishantrai18/homage
      how: "저장소 안내에 따라 요청"
      why: "가정 내 다중 시점(1인칭 + 3인칭) 27명, 부엌·욕실·침실·거실 — 시점 다양성·정상 활동 음성 샘플"
      priority: low
  excluded:
    ir_fall_2024: "MDPI Sensors 2024 — 'data contained within the article', 공개 저장소 없음"
    figshare_sdu_7166453: "SDUFall 이 아님 (CSV 4개). SDUFall 원본은 산동대 요청"
    tst_fall_v2: "IEEE DataPort 구독 필요 — 젊은 배우 11명 depth+골격, 우선순위 낮음"
    fukinect_fall: "SharePoint 7.5GB, depth+골격만(RGB 없음), 라이선스 미표기 — 필요 시 브라우저 다운로드"
    msr_dailyactivity3d: "16 활동(lie down on sofa 포함) 10명, SharePoint 게스트 폴더 — 소규모, 필요 시"

  # ───────────────────────────────────────────────────────────────────
  # 3) URFD — 공식 사이트 직접 (wget 가능), Colab 에서 다운로드 가능
  # ───────────────────────────────────────────────────────────────────
  urfd:
    page: https://fenix.ur.edu.pl/~mkepski/ds/uf.html
    license: CC-BY-NC-SA-4.0            # 비상업 — 논문 전용
    citation_required: Kwolek & Kepski (2014), Comput Methods Programs Biomed 117(3)
    sequences: {fall: 30, adl: 40}
    cams: {fall: [cam0, cam1], adl: [cam0]}
    url_pattern: "https://fenix.ur.edu.pl/~mkepski/ds/data/{type}-{nn:02d}-{cam}-{modality}.zip"
    modalities: {rgb: rgb, depth: d}    # 가속도: {type}-{nn}-acc.csv , 동기화: {type}-{nn}-data.csv
    total_bytes_measured: {rgb: 5680000000, depth_cam0: 2300000000}   # HEAD 110회 집계 (2026-09-20), 누락 0
    drive_dest: falldata/urfd
    format_note: zip 안은 PNG 프레임 시퀀스 (영상 파일이 아님) — 프레임→클립 변환 필요
    role: 교차 평가 + depth/가속도 멀티모달 확장 여지

  # ───────────────────────────────────────────────────────────────────
  # 4) Stage 1 바운딩박스 (YOLO 포맷) — Roboflow Universe
  # ───────────────────────────────────────────────────────────────────
  roboflow_bbox:
    note: 사람 검출용 bbox. 개별 프로젝트마다 라이선스가 다르므로 다운로드 전 페이지에서 확인.
    download_requires: Roboflow 계정 API 키 (사용자 발급)
    candidates:
      - url: https://universe.roboflow.com/roboflow-universe-projects/fall-detection-ca3o8/dataset/4
        note: v4 resized640_aug3x. YOLOv8/v5 TXT+YAML 제공
      - url: https://universe.roboflow.com/yolo-gs4dj/fall-detection-ca3o8-x7ajp
        images: 4497
      - url: https://universe.roboflow.com/yolo-h6urw/falling-zvpqk
        images: 4132
        classes: [down, bending, up]
      - url: https://universe.roboflow.com/elderly-fall-detection/fall-detection-wvbiq/dataset/1
        note: YOLOv11 포맷 제공

# ─────────────────────────────────────────────────────────────────────
# 용도별 사용 가능 범위 (라이선스 기준)
# ─────────────────────────────────────────────────────────────────────
usage_policy:
  paper_experiments: [caucafall, edf, OOPS, GMDCSA24, mcfd, up_fall, le2i, occu, urfd]
  service_model_training:              # 서비스에 올리는 최종 모델
    allowed: [GMDCSA24]                # MIT
    primary: AI Hub 71641              # 국내 활용 조건은 이용약관에서 별도 확인
    forbidden: [le2i, urfd]            # CC-BY-NC — 상업 이용 불가
    pending_license_check: [caucafall, edf, OOPS, mcfd, up_fall, occu]

# ─────────────────────────────────────────────────────────────────────
# 전송 계획 (Colab CPU 세션 → Google Drive)
# ─────────────────────────────────────────────────────────────────────
transfer:
  colab_session: omnifall
  colab_disk_free_gb: 94              # 2026-09-20 확인. OCCU(11GB) + 해제분도 여유.
  drive_target: /content/drive/MyDrive/falldata/omnifall
  drive_required_gb: 35               # zip 원본 30GB 보관 기준. Drive 는 5TB (nnn290199@gmail.com) 라 여유 있음
  prerequisite_user_action: "colab drivemount -s omnifall"   # TTY 필요, 사용자가 직접
  strategy:
    - "zip 하나씩: 다운로드 → MD5 검증 → Drive 로 복사 → /content 에서 삭제"
    - 해제는 학습 세션에서 Drive→/content 로 zip 복사 후 수행 (Drive FUSE 위에서 직접 해제하지 않음)
    - 해제·중복 제거·manifest 생성은 scripts/prepare_omnifall.py (긴 형식 중복은 추출 자체를 건너뜀)
